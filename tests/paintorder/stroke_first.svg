<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <!-- style must win over the presentation attribute: stroke first, fill on top -->
  <rect x="20" y="20" width="60" height="60" fill="#ffc800" stroke="#c80000"
        stroke-width="20" style="paint-order:stroke fill" paint-order="fill stroke"/>
</svg>
