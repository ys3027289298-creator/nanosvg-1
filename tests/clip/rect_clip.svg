<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <clipPath id="box">
      <rect x="20" y="20" width="60" height="60"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="#d33"/>
  <g clip-path="url(#box)">
    <rect x="10" y="10" width="80" height="80" fill="#3a7"/>
  </g>
</svg>
